[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "analogue_engine"
version = "0.2.0"
description = "Explainable similarity and ranking of terrestrial candidate areas against planetary reference sites (NASA Space Apps 2026, Planalogy)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # the core uses only the Python standard library

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
